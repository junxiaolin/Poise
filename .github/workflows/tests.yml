name: Core and release contracts
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.7.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' 'rsl-rl-lib==3.0.1' 'rtree==1.3.0'
      - run: python -m pytest -q
